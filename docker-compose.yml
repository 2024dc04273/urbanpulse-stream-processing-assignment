# ===========================================================================
# UrbanPulse — 3-broker Apache Kafka cluster (KRaft mode, no ZooKeeper)
#
#   docker compose up -d              # start the 3 brokers + Kafka-UI
#   docker compose ps                 # check health
#   docker compose --profile flink up -d   # add Flink job/task managers (Task C)
#
# Broker access:
#   * From the HOST  : localhost:9092, localhost:9094, localhost:9096
#   * Inside network : broker1:19092, broker2:19092, broker3:19092
#
# Kafka-UI: http://localhost:8080   (great for the demo video walkthrough)
# ===========================================================================

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.7.1
  environment: &kafka-common-env
    # --- KRaft: every node is both broker and controller -------------------
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:9093,2@broker2:9093,3@broker3:9093"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    # --- listeners ---------------------------------------------------------
    KAFKA_LISTENERS: "CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    # --- cluster-wide replication (RF=3, safe for a 3-broker cluster) ------
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly (Task B)
    # Fixed cluster id so all 3 nodes format the same metadata quorum.
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  networks: [urbanpulse]
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  broker1:
    <<: *kafka-common
    hostname: broker1
    container_name: urbanpulse-broker1
    ports:
      - "9092:9092"          # host -> broker1 EXTERNAL
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker1:19092,EXTERNAL://localhost:9092"
    volumes:
      - broker1-data:/var/lib/kafka/data

  broker2:
    <<: *kafka-common
    hostname: broker2
    container_name: urbanpulse-broker2
    ports:
      - "9094:9092"          # host -> broker2 EXTERNAL
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker2:19092,EXTERNAL://localhost:9094"
    volumes:
      - broker2-data:/var/lib/kafka/data

  broker3:
    <<: *kafka-common
    hostname: broker3
    container_name: urbanpulse-broker3
    ports:
      - "9096:9092"          # host -> broker3 EXTERNAL
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker3:19092,EXTERNAL://localhost:9096"
    volumes:
      - broker3-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: urbanpulse-kafka-ui
    depends_on:
      broker1: {condition: service_healthy}
      broker2: {condition: service_healthy}
      broker3: {condition: service_healthy}
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "urbanpulse"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker1:19092,broker2:19092,broker3:19092"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [urbanpulse]

  # --- Python toolbox: runs simulators / producers / consumers / DLQ ---------
  # Long-running idle container; you `docker compose exec app <cmd>` into it.
  # (Pinned Python 3.11 so client libs resolve on any host.)
  app:
    build:
      context: .
      dockerfile: infra/app.Dockerfile
    image: urbanpulse/app:latest
    container_name: urbanpulse-app
    depends_on:
      broker1: {condition: service_healthy}
      broker2: {condition: service_healthy}
      broker3: {condition: service_healthy}
    environment:
      URBANPULSE_BOOTSTRAP: "broker1:19092,broker2:19092,broker3:19092"
      PYTHONPATH: "/app"
    volumes:
      - .:/app                       # live source + data + parquet output
    working_dir: /app
    command: ["sleep", "infinity"]   # stay up so we can exec into it
    networks: [urbanpulse]

  # --- Task B: actual Kafka Streams KStream-KTable enrichment ---------------
  # First load data/route_schedule.csv into the compacted route_schedule topic,
  # then start this profile.  The service materialises that topic as a KTable.
  route-enrichment:
    build:
      context: .
      dockerfile: infra/streams.Dockerfile
    image: urbanpulse/route-enrichment:latest
    container_name: urbanpulse-route-enrichment
    profiles: ["streams"]
    depends_on:
      broker1: {condition: service_healthy}
      broker2: {condition: service_healthy}
      broker3: {condition: service_healthy}
    environment:
      URBANPULSE_BOOTSTRAP: "broker1:19092,broker2:19092,broker3:19092"
    networks: [urbanpulse]

  # --- Flink (Task C incident detection) — started with: --profile flink ---
  flink-jobmanager:
    build:
      context: .
      dockerfile: infra/flink.Dockerfile
    image: urbanpulse/flink:1.20
    container_name: urbanpulse-flink-jm
    profiles: ["flink"]
    ports:
      - "8081:8081"          # Flink dashboard
    command: jobmanager
    environment:
      URBANPULSE_BOOTSTRAP: "broker1:19092,broker2:19092,broker3:19092"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    volumes:
      - .:/opt/job            # source (jobs live in src/task_c_flink_spark)
    networks: [urbanpulse]

  flink-taskmanager:
    image: urbanpulse/flink:1.20
    container_name: urbanpulse-flink-tm
    profiles: ["flink"]
    depends_on: [flink-jobmanager]
    command: taskmanager
    environment:
      URBANPULSE_BOOTSTRAP: "broker1:19092,broker2:19092,broker3:19092"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - .:/opt/job
    networks: [urbanpulse]

  # --- Spark (Task C ward analytics) — started with: --profile spark ---------
  spark:
    build:
      context: .
      dockerfile: infra/spark.Dockerfile
    image: urbanpulse/spark:3.5
    container_name: urbanpulse-spark
    profiles: ["spark"]
    depends_on:
      broker1: {condition: service_healthy}
    environment:
      URBANPULSE_BOOTSTRAP: "broker1:19092,broker2:19092,broker3:19092"
      PYTHONPATH: "/opt/job"
    volumes:
      - .:/opt/job            # source + Parquet output land back on the host
    working_dir: /opt/job
    command: ["sleep", "infinity"]
    networks: [urbanpulse]

networks:
  urbanpulse:
    name: urbanpulse-net

volumes:
  broker1-data:
  broker2-data:
  broker3-data:
